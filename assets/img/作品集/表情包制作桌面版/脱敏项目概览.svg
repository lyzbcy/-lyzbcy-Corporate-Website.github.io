<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">表情包制作桌面版脱敏概览</title><desc id="desc">抽象展示从 skill 到桌面 app、四步生成与微信上架流程，不含真实业务数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111e"/><stop offset="1" stop-color="#15253d"/></linearGradient>
    <linearGradient id="a"><stop stop-color="#54e1a6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="magenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4d8f"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="240" fill="#ff4d8f" opacity=".07"/>
  <text x="72" y="74" fill="#8ea0b8" font-family="Arial,PingFang SC" font-size="18" letter-spacing="5">SANITIZED CASE STUDY · DESKTOP APP</text>
  <text x="72" y="142" fill="#fff" font-family="Arial,PingFang SC" font-size="48" font-weight="700">表情包制作桌面版</text>
  <text x="72" y="182" fill="#8da0b8" font-family="Arial,PingFang SC" font-size="20">把 skill 打包成 app · 一条龙 · 普通人也能用</text>

  <rect x="72" y="230" width="540" height="340" rx="20" fill="#0c1726" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="98" y="262" width="488" height="40" rx="10" fill="#13243a"/>
  <circle cx="120" cy="282" r="6" fill="#ff4d8f"/>
  <circle cx="140" cy="282" r="6" fill="#fbbf24"/>
  <circle cx="160" cy="282" r="6" fill="#54e1a6"/>
  <text x="310" y="287" fill="#8ea0b8" font-family="Arial,PingFang SC" font-size="13">表情包制作 · macOS</text>

  <g font-family="Arial,PingFang SC">
    <rect x="98" y="324" width="112" height="112" rx="14" fill="#1a1030" stroke="#ff4d8f" stroke-opacity=".45"/>
    <text x="154" y="388" fill="#ff4d8f" font-size="30" text-anchor="middle">🎨</text>
    <text x="154" y="412" fill="#ff4d8f" font-size="12" text-anchor="middle">角色底图</text>

    <rect x="222" y="324" width="112" height="112" rx="14" fill="#102136" stroke="#60a5fa" stroke-opacity=".45"/>
    <text x="278" y="388" fill="#60a5fa" font-size="30" text-anchor="middle">📖</text>
    <text x="278" y="412" fill="#60a5fa" font-size="12" text-anchor="middle">故事生图</text>

    <rect x="346" y="324" width="112" height="112" rx="14" fill="#0e2a22" stroke="#54e1a6" stroke-opacity=".45"/>
    <text x="402" y="388" fill="#54e1a6" font-size="30" text-anchor="middle">✂️</text>
    <text x="402" y="412" fill="#54e1a6" font-size="12" text-anchor="middle">切图抠图</text>

    <rect x="470" y="324" width="112" height="112" rx="14" fill="#2a1a0e" stroke="#fbbf24" stroke-opacity=".45"/>
    <text x="526" y="388" fill="#fbbf24" font-size="30" text-anchor="middle">📦</text>
    <text x="526" y="412" fill="#fbbf24" font-size="12" text-anchor="middle">上架素材</text>

    <path d="M210 380 L222 380 M334 380 L346 380 M458 380 L470 380" stroke="#8ea0b8" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <rect x="98" y="458" width="488" height="92" rx="14" fill="#0e1c30"/>
  <text x="118" y="488" fill="#8da0b8" font-family="Arial,PingFang SC" font-size="14">输出规格 · 一键直达微信上架</text>
  <g font-family="Arial,PingFang SC" font-size="13">
    <rect x="118" y="502" width="92" height="26" rx="6" fill="#152942" stroke="#54e1a6" stroke-opacity=".5"/><text x="164" y="519" fill="#54e1a6" text-anchor="middle">主图 240</text>
    <rect x="218" y="502" width="92" height="26" rx="6" fill="#152942" stroke="#60a5fa" stroke-opacity=".5"/><text x="264" y="519" fill="#60a5fa" text-anchor="middle">图标 50</text>
    <rect x="318" y="502" width="92" height="26" rx="6" fill="#152942" stroke="#ff4d8f" stroke-opacity=".5"/><text x="364" y="519" fill="#ff4d8f" text-anchor="middle">封面横幅</text>
    <rect x="418" y="502" width="92" height="26" rx="6" fill="#152942" stroke="#fbbf24" stroke-opacity=".5"/><text x="464" y="519" fill="#fbbf24" text-anchor="middle">含义词表</text>
  </g>

  <g font-family="Arial,PingFang SC">
    <text x="684" y="282" fill="#54e1a6" font-size="16">FROM SKILL TO APP</text>
    <text x="684" y="328" fill="#fff" font-size="26" font-weight="700">开发者工具 → 普通人软件</text>
    <text x="684" y="370" fill="#8da0b8" font-size="16">命令行脚本 · AI 助手能力</text>
    <rect x="684" y="382" width="12" height="3" fill="#54e1a6"/>
    <text x="684" y="416" fill="#8da0b8" font-size="16">双击即用 · 一条龙 · 四步出图</text>

    <text x="684" y="468" fill="#8da0b8" font-size="17">交付完整度</text>
    <rect x="684" y="484" width="320" height="8" rx="4" fill="#26374b"/>
    <rect x="684" y="484" width="298" height="8" rx="4" fill="url(#a)"/>

    <text x="684" y="526" fill="#8da0b8" font-size="17">本地 Agent 可被脚本接管</text>
    <rect x="684" y="542" width="320" height="8" rx="4" fill="#26374b"/>
    <rect x="684" y="542" width="272" height="8" rx="4" fill="url(#magenta)"/>
  </g>

  <text x="72" y="630" fill="#64748b" font-family="Arial,PingFang SC" font-size="15">配图为脱敏概览，不是 app 截图</text>
</svg>
