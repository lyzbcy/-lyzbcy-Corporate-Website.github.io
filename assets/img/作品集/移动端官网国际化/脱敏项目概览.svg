<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">移动端官网国际化脱敏概览</title><desc id="desc">抽象展示多页面、中英双语切换与首屏防闪机制，不含真实业务数据。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111e"/><stop offset="1" stop-color="#15253d"/></linearGradient><linearGradient id="a"><stop stop-color="#54e1a6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="lang"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#54e1a6"/></linearGradient></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="1030" cy="80" r="240" fill="#60a5fa" opacity=".08"/>
  <text x="72" y="74" fill="#8ea0b8" font-family="Arial,PingFang SC" font-size="18" letter-spacing="5">SANITIZED CASE STUDY · i18n</text>
  <text x="72" y="142" fill="#fff" font-family="Arial,PingFang SC" font-size="48" font-weight="700">移动端官网国际化</text>
  <text x="72" y="182" fill="#8da0b8" font-family="Arial,PingFang SC" font-size="20">原生 i18n · 双语切换 · 首屏防闪 · 线上修复</text>

