  <text x="305" y="296" fill="#60a5fa" font-family="Arial,PingFang SC" font-size="13" font-weight="700">中 / EN</text>

  <rect x="98" y="334" width="240" height="92" rx="14" fill="#152942"/>
  <rect x="118" y="354" width="140" height="12" rx="6" fill="#54e1a6" opacity=".85"/>
  <rect x="118" y="376" width="180" height="9" rx="4" fill="#d9e7f6" opacity=".22"/>
  <rect x="118" y="394" width="110" height="9" rx="4" fill="#d9e7f6" opacity=".22"/>

  <rect x="358" y="334" width="248" height="92" rx="14" fill="#102136"/>
  <rect x="378" y="354" width="150" height="12" rx="6" fill="#60a5fa" opacity=".85"/>
  <rect x="378" y="376" width="200" height="9" rx="4" fill="#d9e7f6" opacity=".22"/>
  <rect x="378" y="394" width="130" height="9" rx="4" fill="#d9e7f6" opacity=".22"/>

  <rect x="98" y="444" width="508" height="92" rx="14" fill="#0e1c30"/>
  <text x="118" y="474" fill="#8da0b8" font-family="Arial,PingFang SC" font-size="14">40+ 页面 · 语言包挂载 · 声明式翻译</text>
  <g font-family="Arial,PingFang SC" font-size="13">
    <rect x="118" y="488" width="68" height="24" rx="6" fill="#152942" stroke="#54e1a6" stroke-opacity=".5"/><text x="130" y="504" fill="#54e1a6">zh-CN</text>
    <rect x="194" y="488" width="68" height="24" rx="6" fill="#152942" stroke="#60a5fa" stroke-opacity=".5"/><text x="208" y="504" fill="#60a5fa">en-US</text>
    <rect x="270" y="488" width="86" height="24" rx="6" fill="#152942" stroke="#8da0b8" stroke-opacity=".4"/><text x="282" y="504" fill="#8da0b8">可扩展</text>
  </g>

  <g font-family="Arial,PingFang SC">
    <text x="704" y="292" fill="#54e1a6" font-size="16">FIRST-PAINT GUARD</text>
    <text x="704" y="338" fill="#fff" font-size="26" font-weight="700">首屏语言先定，再绘图</text>
