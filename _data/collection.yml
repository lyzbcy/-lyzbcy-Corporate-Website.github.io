    plaque_sub: "NO.001 · 已入库"
    collected: 2026-09-03
    origin: 官网 Banner 宣传更新项目
    category: 开发 Skill · 工程方法
    rarity: ★★★☆☆
    storage: _archive/skills/官网PC端开发skill
    story:
      - 一件从「一天上线」的项目里炼出来的技能书。那天傍晚接到需求：首页第一屏换宣传 Banner、更新办公地址，第二天上线。官网是纯静态多页站 + 运行时 i18n，改起来不难，难的是不漏——中英两份语言包、JSON-LD、地图坐标、?v= 缓存版本号，任何一处漏掉都会变成线上事故。
      - 于是把所有的坑固化成三层结构：渐进式披露的文档（改什么读什么）、变更文件数据库（打包照单核对）、上线 DoD（缺一不可）。CR 环节还请了一个没有上下文的子代理来挑刺，抓出两个阻断项。
      - 第二天准时上线，零遗漏。这件藏品的意义在于提醒：小需求靠流程兜底，不靠记性。
    actions:
